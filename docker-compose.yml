services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dormhub}
      POSTGRES_USER: ${DB_USER:-dormhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - dormhub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dormhub}
      DB_USER: ${DB_USER:-dormhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DISPLAY: :0
      NOVNC_PORT: 6080
      TZ: Europe/Kyiv
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080"
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  dormhub-db-data:
